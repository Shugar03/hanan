<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Hanan: el mejor cielo de la Puna jujeña, hora por hora, y los guías que salen esa noche." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Hanan · cielos de la Puna</title>
    <script>
      /* Tema y modo antes del primer pintado (sin destello). El modo rojo gana sobre el tema. */
      (function () {
        try {
          var d = document.documentElement, t = localStorage.getItem('hanan:tema');
          if (t !== 'claro' && t !== 'oscuro') t = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro';
          d.dataset.tema = t;
          if (localStorage.getItem('hanan:modo') === 'rojo') d.dataset.modo = 'rojo';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
